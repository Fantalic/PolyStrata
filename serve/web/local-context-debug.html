<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyStrata — Local Context Debugger</title>
<link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web/tokens.css">
<link rel="stylesheet" href="/web/components.css">
<style>
/* === local-context debugger: compact and data-first === */
:root { --lc-bg: var(--st-surface-1); --lc-surface: var(--st-surface-2); --lc-border: var(--st-line); }

.lc-app { display: flex; flex-direction: column; gap: var(--st-s-4); flex: 1; overflow: hidden; font-size: var(--st-fs-sm); }

/* Header */
.lc-header { display: flex; align-items: center; justify-content: space-between; padding: var(--st-s-3) 0; border-bottom: 1px solid var(--lc-border); }
.lc-header h2 { margin: 0; font-size: var(--st-fs-md); font-weight: 700; }
.lc-refresh { display: flex; align-items: center; gap: var(--st-s-2); font-size: var(--st-fs-xs); color: var(--st-ink-muted); }
.lc-refresh input[type=checkbox] { accent-color: var(--st-primary); }

/* Session selector */
.lc-session-bar { display: flex; align-items: center; gap: var(--st-s-3); padding: var(--st-s-3) 0; border-bottom: 1px solid var(--st-line); }
.lc-session-bar select { flex: 1; height: 32px; padding: 0 8px; font-size: var(--st-fs-sm); border: 1px solid var(--st-line); border-radius: var(--st-r-sm); background: var(--st-surface-2); color: var(--st-ink); }
.lc-badge { padding: 2px 8px; border-radius: var(--st-r-sm); font-size: var(--st-fs-xs); font-weight: 600; }
.lc-badge-folded { background: #1a3a1a; color: #4ade80; }
.lc-badge-folding { background: #3a2a1a; color: #fbbf24; }
.lc-badge-idle { background: #1a1a2a; color: #94a3b8; }

/* Stats grid */
.lc-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--st-s-3); }
.lc-stat { background: var(--lc-surface); border: 1px solid var(--lc-border); border-radius: var(--st-r-md); padding: var(--st-s-3); text-align: center; }
.lc-stat-value { font-size: var(--st-fs-lg); font-weight: 700; color: var(--st-primary); }
.lc-stat-label { font-size: var(--st-fs-xs); color: var(--st-ink-muted); margin-top: 2px; }

/* Folding timeline */
.lc-timeline { background: var(--lc-surface); border: 1px solid var(--lc-border); border-radius: var(--st-r-md); padding: var(--st-s-3); }
.lc-timeline h3 { margin: 0 0 var(--st-s-3) 0; font-size: var(--st-fs-sm); font-weight: 600; color: var(--st-ink); }
.lc-timeline-bar { display: flex; gap: 2px; height: 32px; margin-bottom: var(--st-s-2); }
.lc-timeline-bar .lc-bar-segment { flex: 1; background: var(--st-primary); border-radius: 2px; opacity: 0.7; min-width: 4px; }
.lc-timeline-bar .lc-bar-segment:hover { opacity: 1; }
.lc-timeline-legend { display: flex; gap: var(--st-s-4); font-size: var(--st-fs-xs); color: var(--st-ink-muted); }
.lc-timeline-legend span { display: flex; align-items: center; gap: 4px; }
.lc-timeline-legend .dot { width: 8px; height: 8px; border-radius: 50%; }

/* Chunk list */
.lc-chunks { background: var(--lc-surface); border: 1px solid var(--lc-border); border-radius: var(--st-r-md); padding: var(--st-s-3); flex: 1; min-height: 200px; display: flex; flex-direction: column; }
.lc-chunks h3 { margin: 0 0 var(--st-s-3) 0; font-size: var(--st-fs-sm); font-weight: 600; color: var(--st-ink); }
.lc-chunk-list { flex: 1; overflow-y: auto; }
.lc-chunk-item { display: flex; justify-content: space-between; align-items: center; padding: var(--st-s-2); border-bottom: 1px solid var(--st-line); cursor: pointer; }
.lc-chunk-item:hover { background: var(--st-surface-1); }
.lc-chunk-item.active { background: var(--st-surface-3); border-left: 3px solid var(--st-primary); }
.lc-chunk-item .lc-chunk-index { font-weight: 600; color: var(--st-primary); min-width: 30px; }
.lc-chunk-item .lc-chunk-size { color: var(--st-ink-muted); font-size: var(--st-fs-xs); }
.lc-chunk-preview { padding: var(--st-s-3); background: var(--st-surface-3); border-radius: var(--st-r-sm); margin-top: var(--st-s-3); font-size: var(--st-fs-xs); color: var(--st-ink-muted); max-height: 150px; overflow-y: auto; white-space: pre-wrap; display: none; }
.lc-chunk-preview.visible { display: block; }

/* Todo list */
.lc-todo { background: var(--lc-surface); border: 1px solid var(--lc-border); border-radius: var(--st-r-md); padding: var(--st-s-3); }
.lc-todo h3 { margin: 0 0 var(--st-s-3) 0; font-size: var(--st-fs-sm); font-weight: 600; color: var(--st-ink); }
.lc-todo-item { display: flex; gap: var(--st-s-2); padding: var(--st-s-2) 0; border-bottom: 1px solid var(--st-line); font-size: var(--st-fs-xs); }
.lc-todo-item.done { color: var(--st-ink-muted); text-decoration: line-through; }
.lc-todo-check { flex: 0 0 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.lc-todo-check.done { background: #1a3a1a; color: #4ade80; }
.lc-todo-check.pending { background: #3a2a1a; color: #fbbf24; }

/* Log */
.lc-log { background: var(--lc-surface); border: 1px solid var(--lc-border); border-radius: var(--st-r-md); padding: var(--st-s-3); max-height: 300px; overflow-y: auto; }
.lc-log h3 { margin: 0 0 var(--st-s-3) 0; font-size: var(--st-fs-sm); font-weight: 600; color: var(--st-ink); }
.lc-log-entry { padding: var(--st-s-1) 0; border-bottom: 1px solid var(--st-line); font-size: var(--st-fs-xs); }
.lc-log-entry .lc-log-time { color: var(--st-primary); font-weight: 600; margin-right: var(--st-s-2); }
.lc-log-entry .lc-log-text { color: var(--st-ink); }
.lc-log-entry .lc-log-reason { color: var(--st-ink-muted); font-style: italic; margin-top: 2px; }

/* Empty state */
.lc-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--st-s-10); color: var(--st-ink-muted); text-align: center; }
.lc-empty svg { width: 48px; height: 48px; margin-bottom: var(--st-s-3); opacity: 0.5; }

/* Loading */
.lc-loading { display: flex; align-items: center; justify-content: center; padding: var(--st-s-6); color: var(--st-ink-muted); }
.lc-loading::before { content: ""; width: 20px; height: 20px; border: 2px solid var(--st-line); border-top-color: var(--st-primary); border-radius: 50%; animation: lc-spin 0.6s linear infinite; margin-right: var(--st-s-2); }
@keyframes lc-spin { to { transform: rotate(360deg); } }

/* Layout */
.lc-main { display: flex; gap: var(--st-s-4); flex: 1; overflow: hidden; }
.lc-left { width: 320px; flex: 0 0 320px; display: flex; flex-direction: column; gap: var(--st-s-4); overflow-y: auto; }
.lc-right { flex: 1; display: flex; flex-direction: column; gap: var(--st-s-4); overflow: hidden; }
</style>
</head>
<body>
<div class="lc-app" id="lc-app">
  <!-- Header -->
  <div class="lc-header">
    <h2>Local Context Debugger</h2>
    <div class="lc-refresh">
      <input type="checkbox" id="auto-refresh" checked>
      <label for="auto-refresh">Auto-refresh</label>
      <span id="last-update"></span>
    </div>
  </div>

  <!-- Session selector -->
  <div class="lc-session-bar">
    <select id="session-select"><option value="">— Loading sessions… —</option></select>
    <span id="fold-status" class="lc-badge lc-badge-idle">idle</span>
  </div>

  <div class="lc-main">
    <!-- Left panel: selected session details -->
    <div class="lc-left" id="lc-left">
      <!-- Stats -->
      <div class="lc-stats" id="lc-stats">
        <div class="lc-stat"><div class="lc-stat-value" id="stat-chunks">—</div><div class="lc-stat-label">Chunks</div></div>
        <div class="lc-stat"><div class="lc-stat-value" id="stat-chars">—</div><div class="lc-stat-label">Chars Archived</div></div>
        <div class="lc-stat"><div class="lc-stat-value" id="stat-foldings">—</div><div class="lc-stat-label">Fold Events</div></div>
        <div class="lc-stat"><div class="lc-stat-value" id="stat-tokens">—</div><div class="lc-stat-label">Tokens Saved</div></div>
        <div class="lc-stat"><div class="lc-stat-value" id="stat-tasks">—</div><div class="lc-stat-label">Tasks Done</div></div>
      </div>

      <!-- Folding timeline -->
      <div class="lc-timeline" id="lc-timeline">
        <h3>Folding Timeline</h3>
        <div class="lc-timeline-bar" id="lc-timeline-bar"></div>
        <div class="lc-timeline-legend">
          <span><span class="dot" style="background:var(--st-primary)"></span> Compression event</span>
        </div>
      </div>

      <!-- Chunk list -->
      <div class="lc-chunks" id="lc-chunks">
        <h3>Chunk Archive</h3>
        <div class="lc-chunk-list" id="lc-chunk-list">
          <div class="lc-empty">No chunks yet</div>
        </div>
        <div class="lc-chunk-preview" id="lc-chunk-preview"></div>
      </div>
    </div>

    <!-- Right panel: todo + log -->
    <div class="lc-right" id="lc-right">
      <!-- Todo -->
      <div class="lc-todo" id="lc-todo">
        <h3>Task Progress</h3>
        <div id="lc-todo-list"><div class="lc-empty">No tasks</div></div>
      </div>

      <!-- Log -->
      <div class="lc-log" id="lc-log">
        <h3>Activity Log</h3>
        <div id="lc-log-list"><div class="lc-empty">No entries</div></div>
      </div>
    </div>
  </div>
</div>

<script src="/web/local-context-debug.js?v=2"></script>
</body>
</html>
